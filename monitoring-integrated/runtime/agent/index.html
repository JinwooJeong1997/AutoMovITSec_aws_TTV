<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel · 웹 서비스 관제</title>
<style>
:root{color-scheme:dark;--bg:#0b1019;--panel:#141c2a;--line:#293448;--fg:#e9eef8;--muted:#a3b1c7;--accent:#79dfcc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,sans-serif}header{padding:22px 30px 15px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;letter-spacing:2px;font-weight:750}.brand span{color:var(--accent)}.tag{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}h1{font-size:25px;margin:22px 0 8px}p{color:var(--muted);line-height:1.6}.search{display:flex;gap:10px;margin:18px 0 10px}input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:12px;background:var(--panel);color:var(--fg)}input{min-width:0}#question{flex:1}button{cursor:pointer}button.primary{background:var(--accent);color:#112622;border-color:var(--accent);font-weight:700}button:disabled{opacity:.5;cursor:wait}button:hover:not(:disabled){filter:brightness(1.12)}.examples{display:flex;gap:8px;flex-wrap:wrap}.examples button{padding:6px 10px;font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:15px}a{color:var(--accent)}details{margin:14px 0}summary{cursor:pointer;color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:10px;padding-top:12px}.filters label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}.filters input{width:155px}.filters select{max-width:180px}#message{padding:10px 0;margin:0;min-height:38px}#message.error{color:#ffb3b3}#applied{font-size:12px;color:var(--accent)}#evidence{margin:0 30px}pre{white-space:pre-wrap;word-break:break-all;background:var(--panel);padding:12px;max-height:300px;overflow:auto}iframe{width:100%;height:1150px;border:0;display:block;background:#111217}.help{font-size:12px;margin:6px 0}@media(max-width:700px){header{padding:16px}.search{flex-wrap:wrap}#question{flex-basis:100%}.toolbar{flex-wrap:wrap}iframe{height:1400px}#evidence{margin:0 16px}}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style></head><body><header>
<div class="top"><div class="brand"><span>◈</span> SENTINEL</div><span class="tag" id="engine">연결 확인 중</span></div>
<h1>웹 서비스 통합 관제</h1><p>전체 현황을 기본으로 보고, 필요한 순간에 검색 조건을 좁혀보세요.</p>
<form class="search" id="search"><input id="question" aria-label="모니터링 검색" maxlength="500" placeholder="예: 최근 30분 web-01의 500 오류를 보여줘"><button class="primary" id="submit">검색 적용</button><button type="button" id="reset">기본 화면</button></form>
<div class="examples"><button data-example="최근 30분 5xx">최근 30분 · 서버 오류</button><button data-example="최근 1시간 로그인 실패">최근 1시간 · 로그인 실패</button><button data-example="최근 15분 web-01">web-01만 보기</button></div>
<details><summary>직접 필터 선택</summary><form id="manual" class="filters">
<label>기간<select name="minutes"><option value="15">최근 15분</option><option value="30">최근 30분</option><option value="60">최근 1시간</option><option value="360">최근 6시간</option><option value="1440">최근 24시간</option></select></label>
<label>서버<input name="server" placeholder="전체 / i-… / web-01"></label><label>IP<input name="ip" placeholder="전체"></label><label>정확한 경로<input name="path" placeholder="전체 / /login"></label>
<label>응답<select name="status"><option value="all">전체</option><option>4xx</option><option>5xx</option><option>200</option><option>401</option><option>403</option><option>404</option><option>500</option></select></label>
<label>이벤트<select name="event"><option value="all">전체</option><option value="login_failed">로그인 실패</option><option value="authorization_denied">권한 거부</option><option value="suspicious_request">공격 의심</option></select></label><button class="primary">필터 적용</button></form></details>
<p class="help" id="privacy">검색은 조회 조건만 변경합니다. 로그 수집·차단·알림 설정은 변경하지 않습니다.</p>
<div class="toolbar"><span id="applied">기본 조건 · 전체 서버 · 최근 15분</span><a id="full" href="/grafana/d/integrated-web" target="_blank" rel="noopener">Grafana에서 열기 ↗</a></div><p id="message" role="status" aria-live="polite">기본 대시보드는 1분마다 갱신됩니다.</p>
</header><details id="evidence" hidden><summary>조회 근거 · 적용 쿼리와 최근 로그</summary><pre id="query"></pre><pre id="logs"></pre></details>
<iframe id="dashboard" title="Grafana 기본 관제 대시보드" src="/grafana/d/integrated-web?from=now-15m&to=now&refresh=1m&kiosk"></iframe>
<script>
const $=s=>document.querySelector(s);let defaultUrl='/grafana/d/integrated-web?from=now-15m&to=now&refresh=1m&kiosk';let sequence=0;
function message(t,error=false){$('#message').textContent=t;$('#message').classList.toggle('error',error)}
async function run(body){const id=++sequence;$('#submit').disabled=true;message('조건을 확인하고 로그를 조회하고 있습니다…');try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===429)throw Error('조회 요청이 많습니다. 잠시 후 다시 시도하세요.');if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'조회에 실패했습니다.')}const d=await r.json();if(id!==sequence)return;$('#dashboard').src=d.dashboard_url;$('#full').href=d.dashboard_url.replace('&kiosk=','');$('#applied').textContent=`최근 ${d.plan.minutes}분 · 서버 ${d.plan.server||'전체'} · IP ${d.plan.ip||'전체'} · 경로 ${d.plan.path||'전체'} · ${d.plan.status} · ${d.plan.event}`;message(d.summary+' (이 검색 요약은 조회 시점 기준이며 아래 패널은 자동 갱신됩니다.)');$('#query').textContent=d.query;$('#logs').textContent=d.rows.map(x=>`${x.server} ${x.line}`).join('\n')||'선택 조건의 로그가 없습니다.';$('#evidence').hidden=false;}catch(e){if(id===sequence)message(e.message,true)}finally{if(id===sequence)$('#submit').disabled=false}}
$('#search').onsubmit=e=>{e.preventDefault();run({text:$('#question').value})};$('#manual').onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.minutes=Number(p.minutes);run({plan:p})};document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('#question').value=b.dataset.example;run({text:b.dataset.example})});$('#reset').onclick=()=>{sequence++;$('#submit').disabled=false;$('#question').value='';$('#manual').reset();$('#dashboard').src=defaultUrl;$('#full').href=defaultUrl;$('#evidence').hidden=true;$('#applied').textContent='기본 조건 · 전체 서버 · 최근 15분';message('기본 대시보드는 1분마다 갱신됩니다.')};
fetch('/api/config').then(r=>r.json()).then(d=>{defaultUrl=d.default_url;$('#engine').textContent=d.engine==='bedrock'?'AI 검색 · Amazon Bedrock':'키워드 검색 · AI 미연결';if(d.engine==='bedrock')$('#privacy').textContent='검색 문장만 Bedrock으로 전송합니다. 원본 로그는 모델에 보내지 않습니다. 최대 24시간 범위의 읽기 전용 조회입니다.';else $('#privacy').textContent='현재는 규칙 기반 키워드 검색입니다. AI 연결 후 자연어 해석을 사용할 수 있습니다. 수집·차단 설정은 변경하지 않습니다.'}).catch(()=>message('검색 서비스 연결을 확인하세요. 기본 Grafana는 계속 이용할 수 있습니다.',true));
</script></body></html>
