# grafana/grafana.ini
[users]
# 불필요한 외부 사용자 자체 회원가입 기능 비활성화
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_language = ko-KR

[auth.anonymous]
# 인증 없는 익명 접근 차단 (보안 유지)
enabled = false

[alerting]
# 프로젝트에서는 Grafana 자체 Alerting 대신 CloudWatch/GuardDuty/SQS 파이프라인을 사용하므로 비활성화
enabled = false

[unified_alerting]
# Grafana 8+ 통합 알림 엔진 비활성화 (리소스 절약 및 좌측 메뉴 제거)
enabled = false

[explore]
# 관제 전용 대시보드만 남기고 ad-hoc 쿼리를 던지는 Explore 메뉴 비활성화 (선택 사항)
enabled = false

[help]
# 우측 상단 도움말 및 커뮤니티 링크 비활성화
enabled = false

[analytics]
# Grafana 본사로 전송되는 원격 진단 데이터/피드백 수집 비활성화
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[panels]
# 덤프/원격 트리거 버튼 실행을 위해 HTML 스크립트 살리기 (필수)
disable_sanitize_html = true
