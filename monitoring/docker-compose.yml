name: grafana-loki-demo
services:
  init-storage:
    image: busybox:1.37.0
    user: "0:0"
    command: ["chown", "10001:10001", "/loki"]
    volumes: ["loki-data:/loki"]
    restart: "no"
  generator:
    build: ./generator
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["web-logs:/logs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  loki:
    depends_on:
      init-storage:
        condition: service_completed_successfully
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    restart: unless-stopped
  
  sqs-worker:
    build: ./sqs-worker
    env_file:
      - ./sqs-worker/.env
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-demo-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/security-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki]
    restart: unless-stopped
volumes:
  web-logs:
  loki-data:
  alloy-data:
  grafana-data:
